services:
  postgres:
    image: postgres:16-alpine
    container_name: growlink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: growlink
    ports:
      - "5432:5432"
    volumes:
      - growlink-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d growlink"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: growlink-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - growlink-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  growlink-postgres:
  growlink-redis:
