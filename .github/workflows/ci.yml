name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: typecheck + lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm prisma generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  build:
    name: next build (mock)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm prisma generate
      - run: pnpm build
        env:
          # AI_PROVIDER=mock のままビルド検証。Sentry / DB は build に不要。
          AI_PROVIDER: mock
          EMAIL_PROVIDER: mock
          OCR_PROVIDER: mock
          QUEUE_PROVIDER: memory
          TWILIO_PROVIDER: mock
          STT_PROVIDER: mock
          TTS_PROVIDER: mock
          AUTH_SECRET: ci-static-secret-for-build-only-not-real
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dummy
